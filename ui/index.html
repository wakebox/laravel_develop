<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>資產資料建立</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="asset-page">
        <header class="page-header">
            <div>
                <p class="eyebrow">固定資產</p>
                <h1>資產資料建立</h1>
                <p class="subtitle">依 OA3.0 架構設計的前端示意頁。</p>
            </div>
            <div class="header-actions">
                <button class="btn ghost" type="button">重設</button>
                <button class="btn primary" type="button">存檔</button>
            </div>
        </header>

        <section class="panel search-panel">
            <div class="panel-title">查詢條件</div>
            <div class="grid-4">
                <label class="field">
                    <div class="label">財產編號</div>
                    <input placeholder="模糊搜尋" />
                </label>
                <label class="field">
                    <div class="label">財產名稱</div>
                    <input placeholder="模糊搜尋" />
                </label>
                <label class="field">
                    <div class="label">供應商</div>
                    <select>
                        <option value="">請選擇</option>
                        <option value="v1">新鴻科技</option>
                        <option value="v2">聯達實業</option>
                    </select>
                </label>
                <label class="field">
                    <div class="label">列管/列帳</div>
                    <select>
                        <option value="">請選擇</option>
                        <option value="1">列管且列帳</option>
                        <option value="2">列管不列帳</option>
                        <option value="3">列帳不列管</option>
                    </select>
                </label>
            </div>
            <div class="panel-actions">
                <button class="btn" type="button">查詢</button>
                <button class="btn ghost" type="button">清除</button>
            </div>
        </section>

        <section class="panel list-panel">
            <div class="panel-title">OA 列表</div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>財產編號</th>
                            <th>財產名稱</th>
                            <th>資產規格</th>
                            <th>供應商</th>
                            <th>列管/列帳</th>
                            <th>取得日期</th>
                            <th>取得數量</th>
                            <th>取得成本</th>
                            <th>保管人</th>
                            <th>部門編號</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>FA-2025-0001</td>
                            <td>高效能伺服器</td>
                            <td>2U/64GB</td>
                            <td>新鴻科技</td>
                            <td>列管且列帳</td>
                            <td>114/06/23</td>
                            <td>1</td>
                            <td class="number">1,000,000</td>
                            <td>王小明</td>
                            <td>D001</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="panel form-panel">
            <div class="panel-title">資產資料維護</div>
            <div class="tabs">
                <button class="tab active" type="button">基本區</button>
                <button class="tab" type="button">折舊區</button>
                <button class="tab" type="button">異動區</button>
                <button class="tab" type="button">異動記錄</button>
            </div>

            <div class="grid-3">
                <label class="field">
                    <div class="label">財產編號<span class="required">*</span></div>
                    <input placeholder="僅英文與數字" />
                </label>
                <label class="field">
                    <div class="label">財產名稱<span class="required">*</span></div>
                    <input />
                </label>
                <label class="field">
                    <div class="label">資產規格</div>
                    <input />
                </label>

                <label class="field">
                    <div class="label">單位<span class="required">*</span></div>
                    <select>
                        <option value="">請選擇</option>
                        <option>台</option>
                        <option>輛</option>
                        <option>棟</option>
                        <option>匹</option>
                    </select>
                </label>
                <label class="field">
                    <div class="label">供應商</div>
                    <select>
                        <option value="">請選擇</option>
                        <option value="v1">新鴻科技</option>
                        <option value="v2">聯達實業</option>
                    </select>
                </label>
                <label class="field">
                    <div class="label">取得日期</div>
                    <input type="date" />
                </label>

                <label class="field">
                    <div class="label">列管/列帳<span class="required">*</span></div>
                    <select>
                        <option value="1">列管且列帳</option>
                        <option value="2">列管不列帳</option>
                        <option value="3">列帳不列管</option>
                    </select>
                </label>
                <label class="field">
                    <div class="label">保管人<span class="required">*</span></div>
                    <select>
                        <option value="">請選擇</option>
                        <option value="e1">王小明</option>
                        <option value="e2">陳怡君</option>
                    </select>
                </label>
                <label class="field">
                    <div class="label">部門編號</div>
                    <select>
                        <option value="">請選擇</option>
                        <option value="D001">D001 研發部</option>
                        <option value="D002">D002 行政部</option>
                    </select>
                    <div class="hint">預設依保管人帶入，可自行調整。</div>
                </label>

                <label class="field">
                    <div class="label">存放地點</div>
                    <input />
                </label>
                <label class="field read-only">
                    <div class="label">取得數量</div>
                    <input value="1" readonly />
                </label>
                <label class="field">
                    <div class="label">取得成本<span class="required">*</span></div>
                    <input placeholder="正整數" />
                </label>

                <label class="field read-only">
                    <div class="label">成本總和</div>
                    <input value="" readonly />
                    <div class="hint">預設等於取得成本。</div>
                </label>
                <label class="field">
                    <div class="label">主財產編號<span class="required">*</span></div>
                    <input placeholder="預設=財產編號" />
                </label>
                <label class="field">
                    <div class="label">帳務科目<span class="required">*</span></div>
                    <select>
                        <option value="">請選擇</option>
                        <option value="A100">A100 固定資產</option>
                        <option value="A200">A200 累計折舊</option>
                    </select>
                </label>

                <label class="field">
                    <div class="label">預留殘值</div>
                    <input />
                    <div class="hint">預設自動計算，存檔限制不可大於取得成本。</div>
                </label>
                <label class="field">
                    <div class="label">抵押狀態</div>
                    <select>
                        <option value="1">未抵押</option>
                        <option value="2">已抵押</option>
                    </select>
                    <div class="hint">存檔後鎖定，僅由抵押作業回寫。</div>
                </label>
                <label class="field">
                    <div class="label">投保狀態</div>
                    <select>
                        <option value="1">未投保</option>
                        <option value="2">已投保</option>
                    </select>
                    <div class="hint">存檔後鎖定，僅由投保作業回寫。</div>
                </label>
            </div>

            <div class="panel-actions footer-actions">
                <div class="note">金額欄位顯示千分位，例如 1,000,000。</div>
                <div class="actions">
                    <button class="btn ghost" type="button">取消</button>
                    <button class="btn primary" type="button">送出</button>
                </div>
            </div>
        </section>
    </div>
</body>

</html>
